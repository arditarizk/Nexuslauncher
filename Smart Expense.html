<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>PundiCerdas — Cashflow Suami</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"><style>/* ============================================================   PUNDI CERDAS — Gen-Z Playful Design System   Font: Plus Jakarta Sans (UI) + IBM Plex Mono (angka)   ============================================================ */:root {    --bg: #F7F8FB;    --surface: #FFFFFF;    --surface-tint: #F1F3F8;    --navy-900: #0B1120;    --navy-800: #111827;    --navy-700: #1E2536;    --muted: #94A3B8;    --muted-light: #CBD5E1;    /* Primary CTA */    --pundi: #FF7A1A;    --pundi-dark: #E8650A;    --pundi-tint: #FFF3EA;    --pundi-tint-2: #FFE3CC;    /* Status */    --emerald: #10B981;    --emerald-tint: #D1FAE5;    --rose: #F43F5E;    --rose-tint: #FFE4E8;    --amber: #F59E0B;    --amber-tint: #FEF3C7;    --border: #EEF0F5;    --radius-lg: 26px;    --radius-md: 18px;    --radius-sm: 14px;    --radius-pill: 999px;    --shadow-soft: 0 14px 40px -14px rgba(11,17,32,0.14), 0 4px 12px -4px rgba(11,17,32,0.06);    --shadow-float: 0 18px 36px -12px rgba(255,122,26,0.4);    --font-display: 'Plus Jakarta Sans', sans-serif;    --font-body: 'Plus Jakarta Sans', sans-serif;    --font-mono: 'IBM Plex Mono', monospace;}/* Kategori palette (dipakai lewat kelas .chip-<warna> / .tag-<warna>) */.pal-mint   { --pal: #00C896; --pal-tint: #DFFBF2; }.pal-orange { --pal: #FF7A1A; --pal-tint: #FFF3EA; }.pal-amber  { --pal: #F59E0B; --pal-tint: #FEF3C7; }.pal-indigo { --pal: #4F46E5; --pal-tint: #EEF2FF; }.pal-rose   { --pal: #E11D48; --pal-tint: #FFF1F3; }.pal-cyan   { --pal: #06B6D4; --pal-tint: #ECFEFF; }.pal-violet { --pal: #7C3AED; --pal-tint: #F3EBFF; }.pal-slate  { --pal: #64748B; --pal-tint: #F1F5F9; }* { box-sizing: border-box; }html, body {    margin: 0;    padding: 0;    background: var(--bg);    color: var(--navy-900);    font-family: var(--font-body);    -webkit-tap-highlight-color: transparent;    -webkit-font-smoothing: antialiased;}input, button, select { font-family: inherit; }.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }::-webkit-scrollbar { width: 0; height: 0; }@keyframes popIn { from { opacity:0; transform: translateY(14px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }@keyframes spin { to { transform: rotate(360deg); } }/* ============================================================   SHELL / LAYOUT   ============================================================ */#app {    max-width: 480px;    margin: 0 auto;    min-height: 100vh;    background: var(--bg);    position: relative;    padding-bottom: 40px;}@media (min-width: 900px) {    body {        min-height: 100vh;        display: flex;        align-items: center;        justify-content: center;        background:            radial-gradient(circle at 12% 20%, rgba(255,122,26,0.10), transparent 40%),            radial-gradient(circle at 88% 78%, rgba(79,70,229,0.10), transparent 40%),            #EDEFF6;        padding: 40px 0;    }    #app.phone-shell {        border-radius: 40px;        box-shadow: 0 60px 120px -40px rgba(11,17,32,0.35), 0 0 0 10px #0E1424;        min-height: 90vh;        max-height: 920px;        overflow-y: auto;    }}/* ============================================================   HEADER   ============================================================ */.app-header {    position: sticky;    top: 0;    z-index: 30;    background: var(--navy-900);    display: flex;    align-items: center;    justify-content: space-between;    padding: 18px 20px;}@media (min-width: 900px) { .app-header { border-radius: 40px 40px 0 0; } }.brand { display: flex; align-items: center; gap: 12px; }.brand-badge {    width: 42px; height: 42px;    border-radius: var(--radius-sm);    background: var(--pundi);    color: #fff;    display: flex; align-items: center; justify-content: center;    font-size: 20px;    box-shadow: var(--shadow-float);}.brand-badge i { width: 22px; height: 22px; }.brand-title { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: #fff; margin: 0; letter-spacing: -0.2px; }.brand-title span { color: var(--pundi); }.brand-sub { margin: 2px 0 0; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); }.header-actions { display: flex; align-items: center; gap: 8px; }.sync-badge {    display: inline-flex; align-items: center; gap: 6px;    font-size: 10px; font-weight: 800;    padding: 7px 12px;    border-radius: var(--radius-pill);    background: rgba(255,255,255,0.08);    color: rgba(255,255,255,0.7);}.sync-badge i { width: 13px; height: 13px; }.sync-badge.sync-online, .sync-badge.sync-realtime { color: #34E4B0; background: rgba(0,200,150,0.16); }.sync-badge.sync-error { color: var(--rose); background: rgba(244,63,94,0.16); }.sync-badge.sync-offline { color: var(--amber); background: rgba(245,158,11,0.16); }.sync-badge .spin { animation: spin 1s linear infinite; }.icon-btn {    width: 38px; height: 38px;    border-radius: 50%;    border: none;    background: rgba(255,255,255,0.08);    color: #fff;    display: flex; align-items: center; justify-content: center;    cursor: pointer;    transition: background 0.2s ease, transform 0.15s ease;}.icon-btn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }.icon-btn:active { transform: scale(0.92); }.icon-btn i { width: 18px; height: 18px; }/* ============================================================   TAB NAV   ============================================================ */.tab-nav { display: flex; gap: 8px; padding: 16px 20px 4px; }.tab-btn {    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;    padding: 12px 0;    border: none;    border-radius: var(--radius-pill);    background: var(--surface);    color: var(--muted);    font-weight: 800; font-size: 13px;    cursor: pointer;    box-shadow: 0 6px 16px -8px rgba(11,17,32,0.08);    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);}.tab-btn i { width: 16px; height: 16px; }.tab-btn.active { background: var(--navy-900); color: var(--pundi); box-shadow: 0 10px 24px -8px rgba(11,17,32,0.35); }.tab-btn:active { transform: scale(0.97); }/* ============================================================   MAIN / CARDS   ============================================================ */.app-main { padding: 8px 20px 20px; }.tab-panel { display: flex; flex-direction: column; gap: 16px; }.card {    background: var(--surface);    border-radius: var(--radius-lg);    padding: 20px;    box-shadow: var(--shadow-soft);    border: 1px solid var(--border);    animation: popIn 0.35s cubic-bezier(0.16,1,0.3,1) both;}.section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }.section-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }.section-header-row .section-label { margin-bottom: 0; }.muted-badge { font-size: 11px; font-weight: 800; color: var(--navy-900); background: var(--surface-tint); padding: 5px 10px; border-radius: var(--radius-pill); }.link-btn {    display: inline-flex; align-items: center; gap: 4px;    font-size: 11px; font-weight: 800; color: var(--pundi-dark);    background: var(--pundi-tint); border: none;    padding: 6px 11px; border-radius: var(--radius-pill);    cursor: pointer; transition: all 0.2s ease;}.link-btn i { width: 13px; height: 13px; }.link-btn:hover { background: var(--pundi-tint-2); transform: translateY(-1px); }.link-btn:active { transform: scale(0.94); }/* Hero card */.card-hero { background: linear-gradient(135deg, var(--navy-900) 0%, #1A2138 100%); color: #fff; position: relative; overflow: hidden; }.card-hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(255,122,26,0.35), transparent 70%); }.eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.55); margin: 0 0 8px; }.hero-amount { font-family: var(--font-mono); font-size: 32px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.5px; color: var(--pundi); }.hero-sub { font-size: 12px; color: rgba(255,255,255,0.55); margin: 0; line-height: 1.5; font-weight: 500; }/* Category grid (dynamic, warna-warni) */.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }.cat-btn {    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;    padding: 12px 6px;    border-radius: var(--radius-md);    background: var(--surface-tint);    border: 2px solid transparent;    cursor: pointer;    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);}.cat-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--pal-tint); color: var(--pal); }.cat-icon i { width: 16px; height: 16px; }.cat-btn span { font-size: 9.5px; font-weight: 800; color: var(--navy-700); text-align: center; line-height: 1.2; }.cat-btn:hover { transform: translateY(-2px); }.cat-btn:active { transform: scale(0.95); }.cat-btn.active { background: var(--pal-tint); border-color: var(--pal); }.cat-btn.cat-add { background: var(--surface); border: 2px dashed var(--muted-light); }.cat-btn.cat-add .cat-icon { background: var(--surface-tint); color: var(--muted); }.chip {    display: inline-flex; align-items: center; gap: 6px;    padding: 10px 16px;    border-radius: var(--radius-pill);    border: 2px solid var(--border);    background: var(--surface-tint);    color: var(--navy-700);    font-size: 12px; font-weight: 700;    cursor: pointer;    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);}.chip i { width: 14px; height: 14px; }.chip:hover { transform: translateY(-2px); }.chip:active { transform: scale(0.95); }.chip.active { background: var(--navy-900); border-color: var(--navy-900); color: var(--pundi); }/* Segmented control */.segmented { display: flex; background: var(--surface-tint); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 16px; }.seg-btn { flex: 1; border: none; background: transparent; padding: 10px 0; border-radius: var(--radius-pill); font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; transition: all 0.2s ease; }.seg-btn.active { background: var(--navy-900); color: var(--pundi); box-shadow: 0 6px 14px -6px rgba(11,17,32,0.3); }/* Form fields */.field { margin-bottom: 14px; }.field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }.input-premium {    width: 100%;    background: var(--surface-tint);    border: 2px solid transparent;    border-radius: var(--radius-md);    padding: 14px 16px;    font-size: 14px; font-weight: 700;    color: var(--navy-900);    outline: none;    transition: all 0.25s ease;}.input-premium:focus { background: #fff; border-color: var(--pundi); box-shadow: 0 0 0 4px var(--pundi-tint-2); }.input-premium::placeholder { color: var(--muted-light); font-weight: 500; }.select-premium { appearance: none; background-image: none; }.input-rupiah { position: relative; display: flex; align-items: center; }.input-rupiah span { position: absolute; left: 16px; font-weight: 800; color: var(--muted); font-size: 14px; font-family: var(--font-mono); pointer-events: none; }.input-amount { padding-left: 40px; font-weight: 700; font-size: 15px; font-family: var(--font-mono); }/* Buttons */.btn-primary {    display: inline-flex; align-items: center; justify-content: center; gap: 8px;    background: var(--pundi);    color: #fff;    border: none;    border-radius: var(--radius-md);    padding: 15px 20px;    font-size: 14px; font-weight: 800;    cursor: pointer;    box-shadow: var(--shadow-float);    transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s ease, background 0.2s ease;}.btn-primary i { width: 18px; height: 18px; }.btn-primary:hover { transform: translateY(-2px); background: var(--pundi-dark); }.btn-primary:active { transform: scale(0.97) translateY(0); }.btn-block { width: 100%; }.btn-secondary {    flex: 1;    display: inline-flex; align-items: center; justify-content: center; gap: 8px;    background: var(--surface);    color: var(--navy-900);    border: 2px solid var(--border);    border-radius: var(--radius-md);    padding: 12px 14px;    font-size: 11.5px; font-weight: 800;    cursor: pointer;    box-shadow: 0 6px 16px -8px rgba(11,17,32,0.08);    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);}.btn-secondary i { width: 15px; height: 15px; }.btn-secondary:hover { transform: translateY(-2px); border-color: var(--pundi); color: var(--pundi-dark); }.btn-secondary:active { transform: scale(0.96); }.btn-secondary.wa { border-color: #D1FAE5; color: #059669; }.btn-secondary.wa:hover { border-color: #059669; }.report-actions { display: flex; gap: 8px; flex-wrap: wrap; }.report-actions .btn-secondary { flex: 1 1 calc(50% - 4px); min-width: 130px; }/* Transaction list */.tx-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }.tx-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--surface-tint); transition: transform 0.15s ease; }.tx-item:hover { transform: translateX(2px); }.tx-icon { width: 38px; height: 38px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }.tx-icon i { width: 18px; height: 18px; }.tx-icon.tx-income { background: var(--emerald-tint); color: #059669; }.tx-icon.tx-expense { background: var(--pal-tint, var(--pundi-tint)); color: var(--pal, var(--pundi)); }.tx-info { flex: 1; min-width: 0; }.tx-cat { margin: 0; font-size: 13px; font-weight: 800; color: var(--navy-900); }.tx-note { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }.tx-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }.tx-amount { margin: 0; font-size: 13px; font-weight: 700; font-family: var(--font-mono); }.text-income { color: #059669; }.text-expense { color: var(--rose); }.tx-delete { width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--muted-light); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }.tx-delete i { width: 14px; height: 14px; }.tx-delete:hover { background: var(--rose-tint); color: var(--rose); }.tx-delete:active { transform: scale(0.9); }.empty-state { text-align: center; padding: 24px 0; color: var(--muted-light); }.empty-state i { width: 30px; height: 30px; margin-bottom: 8px; }.empty-state p { font-size: 12px; font-weight: 700; margin: 0; }/* ============================================================   POCKET CARD (kantong fixed cost, sudut terlipat ala dompet)   ============================================================ */.card-fixed { background: linear-gradient(135deg, var(--pundi-tint) 0%, var(--surface) 55%); }.fixed-item {    position: relative; overflow: hidden;    display: flex; align-items: center; gap: 12px;    padding: 14px;    border-radius: var(--radius-md);    background: var(--surface);    border: 2px solid var(--pundi-tint-2);    margin-bottom: 10px;}.fixed-item::after {    content: '';    position: absolute; top: 0; right: 0;    width: 26px; height: 26px;    background: rgba(255,122,26,0.12);    clip-path: polygon(100% 0, 0 0, 100% 100%);}.fixed-item:last-child { margin-bottom: 0; }.fixed-item.done { border-color: var(--emerald-tint); }.fixed-item.done::after { background: rgba(16,185,129,0.14); }.fixed-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--pundi-tint); color: var(--pundi); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }.fixed-item.done .fixed-icon { background: var(--emerald-tint); color: #059669; }.fixed-icon i { width: 18px; height: 18px; }.fixed-info { flex: 1; min-width: 0; }.fixed-name { margin: 0; font-size: 13px; font-weight: 800; color: var(--navy-900); }.fixed-amount { margin: 2px 0 0; font-size: 15px; font-weight: 700; font-family: var(--font-mono); color: var(--navy-900); }.fixed-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }.toggle-pill {    display: inline-flex; align-items: center; gap: 6px;    padding: 9px 14px;    border-radius: var(--radius-pill);    border: none;    background: var(--surface-tint);    color: var(--muted);    font-size: 11px; font-weight: 800;    cursor: pointer;    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);}.toggle-pill i { width: 14px; height: 14px; }.toggle-pill:hover { transform: translateY(-2px); }.toggle-pill:active { transform: scale(0.94); }.toggle-pill.on { background: var(--emerald); color: #fff; }.mini-delete { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--muted-light); display: flex; align-items: center; justify-content: center; cursor: pointer; }.mini-delete i { width: 13px; height: 13px; }.mini-delete:hover { background: var(--rose-tint); color: var(--rose); }.add-item-btn {    width: 100%;    display: flex; align-items: center; justify-content: center; gap: 6px;    padding: 12px;    border-radius: var(--radius-md);    border: 2px dashed var(--muted-light);    background: transparent;    color: var(--muted);    font-size: 11.5px; font-weight: 800;    cursor: pointer;    transition: all 0.2s ease;}.add-item-btn i { width: 15px; height: 15px; }.add-item-btn:hover { border-color: var(--pundi); color: var(--pundi-dark); background: var(--pundi-tint); }/* Progress bar */.progress-track { width: 100%; height: 14px; background: var(--surface-tint); border-radius: var(--radius-pill); overflow: hidden; margin-bottom: 10px; }.progress-fill { height: 100%; border-radius: var(--radius-pill); transition: width 0.5s cubic-bezier(0.16,1,0.3,1), background 0.3s ease; }.progress-fill.progress-success { background: var(--emerald); }.progress-fill.progress-warning { background: var(--amber); }.progress-fill.progress-danger { background: var(--rose); }.progress-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); font-family: var(--font-mono); }/* Pos Anggaran (budget items) */.budget-item { padding: 13px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface-tint); margin-bottom: 10px; }.budget-item:last-child { margin-bottom: 0; }.budget-item-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }.budget-item-title { margin: 0; font-size: 13px; font-weight: 800; color: var(--navy-900); }.budget-item-cat { margin: 1px 0 0; font-size: 10px; color: var(--muted); font-weight: 700; }.status-badge { font-size: 9px; font-weight: 800; padding: 4px 9px; border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.03em; }.status-badge.aman { background: var(--emerald-tint); color: #059669; }.status-badge.boros { background: var(--rose-tint); color: var(--rose); }.status-badge.belum { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }.budget-item-track { height: 8px; background: var(--surface); border-radius: var(--radius-pill); overflow: hidden; margin-bottom: 6px; }.budget-item-fill { height: 100%; border-radius: var(--radius-pill); transition: width 0.4s ease; }.budget-item-foot { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; font-family: var(--font-mono); }.budget-item-foot .foot-left { color: var(--muted); }.budget-item-actions { display: flex; justify-content: flex-end; margin-top: 6px; }/* Net cashflow card */.card-net { background: var(--navy-900); }.card-net .section-label { color: rgba(255,255,255,0.4); }.net-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); }.net-row span:last-child { font-weight: 700; font-family: var(--font-mono); }.card-net .text-income { color: #34E4B0; }.card-net .text-expense { color: #FF9142; }.net-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 0; }.net-total { font-size: 15px; padding-top: 10px; }.net-total span:first-child { color: #fff; font-weight: 800; font-family: var(--font-body); }/* Forecast / Proyeksi card */.card-forecast { background: linear-gradient(135deg, var(--navy-900) 0%, #1A2138 100%); color: #fff; }.card-forecast .section-label { color: rgba(255,255,255,0.45); }.eyebrow-dark { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); margin: 2px 0 6px; }.forecast-amount { font-family: var(--font-mono); font-size: 26px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.4px; }.forecast-caption { font-size: 11.5px; color: rgba(255,255,255,0.5); line-height: 1.5; margin: 0 0 18px; font-weight: 500; }.forecast-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: var(--radius-pill); }.forecast-badge i { width: 12px; height: 12px; }.forecast-badge.badge-success { background: rgba(52,228,176,0.16); color: #34E4B0; }.forecast-badge.badge-danger { background: rgba(255,77,106,0.16); color: #FF6B85; }.pace-compare { display: flex; flex-direction: column; gap: 12px; }.pace-row { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; }.pace-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.6); }.pace-label i { width: 13px; height: 13px; }.pace-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: var(--radius-pill); overflow: hidden; }.pace-fill { height: 100%; border-radius: var(--radius-pill); transition: width 0.5s cubic-bezier(0.16,1,0.3,1); }.pace-fill.pace-actual { background: #FF9142; }.pace-fill.pace-ideal { background: #34E4B0; }.pace-value { font-size: 11px; font-weight: 700; color: #fff; text-align: right; min-width: 78px; font-family: var(--font-mono); }/* ============================================================   MODAL   ============================================================ */.modal-overlay { position: fixed; inset: 0; background: rgba(11,17,32,0.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }.modal-card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 380px; box-shadow: var(--shadow-soft); animation: popIn 0.3s cubic-bezier(0.16,1,0.3,1) both; max-height: 85vh; overflow-y: auto; }.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }.modal-header h3 { font-family: var(--font-display); font-size: 18px; font-weight: 800; margin: 0; color: var(--navy-900); }.modal-header .icon-btn { background: var(--surface-tint); color: var(--navy-900); }.modal-header .icon-btn:hover { background: var(--border); }.connection-info { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-tint); font-size: 12px; font-weight: 600; color: var(--navy-700); }.connection-info i { width: 16px; height: 16px; flex-shrink: 0; }.connection-info code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; font-size: 11px; }.connection-info.sync-online, .connection-info.sync-realtime { color: #059669; }.connection-info.sync-error, .connection-info.sync-offline { color: var(--rose); }/* ============================================================   TOASTS   ============================================================ */.toast-stack { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: calc(100% - 40px); max-width: 420px; }.toast { background: var(--navy-900); color: #fff; font-size: 12px; font-weight: 700; padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1) both; text-align: center; }@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }.toast-success { border-left: 4px solid var(--emerald); }.toast-warning { border-left: 4px solid var(--amber); }.toast-danger { border-left: 4px solid var(--rose); }/* ============================================================   REDUCED MOTION   ============================================================ */@media (prefers-reduced-motion: reduce) {    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }}/* ============================================================ ss="brand-sub">Cashflow Suami</p>            </div>        </div>        <div class="header-actions">            <span class="sync-badge" :class="'sync-' + connectionStatus">                <i :data-lucide="syncIcon" :class="{'spin': connectionStatus === 'connecting'}"></i>                <span>{{ syncLabel }}</span>            </span>            <button class="icon-btn" @click="openSettings" aria-label="Pengaturan"><i data-lucide="settings"></i></button>        </div>    </header>    <!-- TAB NAV -->    <nav class="tab-nav">        <button class="tab-btn" :class="{active: activeTab === 'harian'}" @click="activeTab = 'harian'">            <i data-lucide="receipt"></i> Harian        </button>        <button class="tab-btn" :class="{active: activeTab === 'bulanan'}" @click="activeTab = 'bulanan'">            <i data-lucide="calendar-days"></i> Bulanan        </button>    </nav>    <!-- MAIN -->    <main class="app-main">        <tab-harian            v-if="activeTab === 'harian'"            :categories="categories"            :sisa-jatah-harian="sisaJatahHarian"            :history-today="todayTx"            :total-today="totalToday"            @add-transaction="addTransaction"            @delete-transaction="deleteTransaction"            @request-add-category="categoryModalOpen = true">        </tab-harian>        <tab-bulanan            v-else            :fixed-costs="fixedCosts"            :budget-items="budgetItemsWithRealisasi"            :total-income="totalIncome"            :total-fixed-cost="totalFixedCost"            :total-variable="totalVariable"            :budget-variable="profile.budgetVariable"            :net-cashflow="netCashflow"            :progress-percent="progressPercent"            :progress-color-class="progressColorClass"            :month-transactions="thisMonthTxSorted"            :actual-daily-pace="actualDailyPace"            :ideal-daily-pace="idealDailyPace"            :projected-variable t-premium input-amount" placeholder="0">                </div>            </div>            <button class="btn-primary btn-block" @click="saveSettings"><i data-lucide="check"></i> Simpan Pengaturan</button>        </div>    </div>    <!-- MODAL: TAMBAH KATEGORI -->    <div class="modal-overlay" v-if="categoryModalOpen" @click.self="categoryModalOpen = false">        <div class="modal-card">            <div class="modal-header">                <h3>Kategori Baru ✨</h3>                <button class="icon-btn" @click="categoryModalOpen = false" aria-label="Tutup"><i data-lucide="x"></i></button>            </div>            <div class="field">                <label>Nama Kategori</label>                <input type="text" v-model="newCategory.nama" placeholder="cth: Laundry" class="input-premium" @keyup.enter="addCategory">            </div>            <button class="btn-primary btn-block" @click="addCategory"><i data-lucide="plus"></i> Tambah Kategori</button>        </div>    </div>    <!-- MODAL: TAMBAH POS ANGGARAN -->    <div class="modal-overlay" v-if="budgetModalOpen" @click.self="budgetModalOpen = false">        <div class="modal-card">            <div class="modal-header">                <h3>Pos Anggaran Baru 🎯</h3>                <button class="icon-btn" @click="budgetModalOpen = false" aria-label="Tutup"><i data-lucide="x"></i></button>            </div>            <div class="field">                <label>Kategori</label>                <select v-model="newBudgetItem.kategori" class="input-premium select-premium">                    <option value="" disabled>Pilih kategori</option>                    <option v-for="c in categories" :key="c.id" :value="c.nama">{{ c.nama }}</option>                </select>            </div>            <div class="field">                <label>Keterangan Pos</label>                <input type="text" v-model="newBudgetItem.keterangan" placeholder="cth: Uang Makan" class="input-premium"> rd card-hero">        <p class="eyebrow">Sisa Jatah Hari Ini 💸</p>        <h2 class="hero-amount mono">{{ fmt(sisaJatahHarian) }}</h2>        <p class="hero-sub">Rekomendasi batas belanja harian, dihitung dari sisa budget bulan ini dibagi sisa hari.</p>    </section>    <section class="card">        <p class="section-label">Catat Transaksi</p>        <div class="segmented">            <button class="seg-btn" :class="{active: jenis === 'expense'}" @click="jenis = 'expense'">Pengeluaran</button>            <button class="seg-btn" :class="{active: jenis === 'income'}" @click="jenis = 'income'">Pemasukan</button>        </div>        <div class="field" v-if="jenis === 'expense'">            <label>Kategori</label>            <div class="cat-grid">                <button v-for="c in categories" :key="c.id" type="button" class="cat-btn" :class="['pal-' + c.color, {active: kategori === c.nama}]" @click="pickCategory(c)">                    <span class="cat-icon"><i :data-lucide="c.icon"></i></span>                    <span>{{ c.nama }}</span>                </button>                <button type="button" class="cat-btn cat-add" @click="$emit('request-add-category')">                    <span class="cat-icon"><i data-lucide="plus"></i></span>                    <span>Baru</span>                </button>            </div>        </div>        <div class="field" v-else>            <label>Kategori</label>            <input type="text" v-model="kategori" placeholder="cth: Gaji, Bonus, THR" class="input-premium">        </div>        <div class="field">            <label>Nominal</label>            <div class="input-rupiah">                <span>Rp</span>                <input type="tel" :value="nominalDisplay" @input="onNominalInput" placeholder="0" class="input-premium input-amount">            </div>        </div>        <div class="field">            <label>Catatan (opsional)</label>            <input type="text" v-model="catatan" pla class="btn-secondary wa" @click="$emit('wa-report', 'minggu')"><i data-lucide="message-circle"></i> WA Mingguan</button>        <button class="btn-secondary wa" @click="$emit('wa-report', 'bulan')"><i data-lucide="message-circle"></i> WA Bulanan</button>    </section>    <section class="card card-forecast">        <div class="section-header-row">            <p class="section-label">Ramalan &amp; Proyeksi</p>            <span class="forecast-badge" :class="forecastStatus === 'surplus' ? 'badge-success' : 'badge-danger'">                <i :data-lucide="forecastStatus === 'surplus' ? 'trending-up' : 'trending-down'"></i>                {{ forecastStatus === 'surplus' ? 'Surplus' : 'Defisit' }}            </span>        </div>        <p class="eyebrow-dark">Proyeksi Sisa/Defisit Akhir Bulan</p>        <h2 class="forecast-amount mono" :class="forecastStatus === 'surplus' ? 'text-income' : 'text-expense'">{{ fmt(projectedNet) }}</h2>        <p class="forecast-caption">Dihitung dari rata-rata laju belanja harianmu sejauh ini, diproyeksikan sampai akhir bulan (perkiraan pengeluaran variabel: {{ fmt(projectedVariable) }}).</p>        <div class="pace-compare">            <div class="pace-row">                <div class="pace-label"><i data-lucide="gauge"></i> Pace Kamu</div>                <div class="pace-track"><div class="pace-fill pace-actual" :style="{ width: paceWidth(actualDailyPace) + '%' }"></div></div>                <div class="pace-value">{{ fmt(actualDailyPace) }}</div>            </div>            <div class="pace-row">                <div class="pace-label"><i data-lucide="target"></i> Pace Ideal</div>                <div class="pace-track"><div class="pace-fill pace-ideal" :style="{ width: paceWidth(idealDailyPace) + '%' }"></div></div>                <div class="pace-value">{{ fmt(idealDailyPace) }}</div>            </div>        </div>    </section>    <section class="card card-fixed">        <div class="section-header-row"> th: Math.min(b.pct, 100) + '%' }"></div>            </div>            <div class="budget-item-foot">                <span class="foot-left">{{ fmt(b.realisasi) }} / {{ fmt(b.nominalBudget) }}</span>                <span :class="b.sisa >= 0 ? 'text-income' : 'text-expense'">{{ b.sisa >= 0 ? 'Sisa ' + fmt(b.sisa) : 'Lebih ' + fmt(Math.abs(b.sisa)) }}</span>            </div>            <div class="budget-item-actions">                <button class="mini-delete" @click="$emit('delete-budget-item', b)" aria-label="Hapus pos"><i data-lucide="trash-2"></i></button>            </div>        </div>        <button class="add-item-btn" style="margin-top: 4px;" @click="$emit('request-add-budget')"><i data-lucide="plus"></i> Tambah Pos Anggaran</button>    </section>    <section class="card">        <div class="section-header-row">            <p class="section-label">Progress Pengeluaran Variabel</p>            <span class="muted-badge">{{ progressPercent }}%</span>        </div>        <div class="progress-track">            <div class="progress-fill" :class="progressColorClass" :style="{ width: Math.min(progressPercent, 100) + '%' }"></div>        </div>        <div class="progress-labels">            <span>{{ fmt(totalVariable) }} terpakai</span>            <span>dari {{ fmt(budgetVariable) }}</span>        </div>    </section>    <section class="card card-net">        <p class="section-label">Net Cashflow</p>        <div class="net-row"><span>Pemasukan</span><span class="text-income">+{{ fmt(totalIncome) }}</span></div>        <div class="net-row"><span>Fixed Cost</span><span class="text-expense">-{{ fmt(totalFixedCost) }}</span></div>        <div class="net-row"><span>Pengeluaran Variabel</span><span class="text-expense">-{{ fmt(totalVariable) }}</span></div>        <div class="net-divider"></div>        <div class="net-row net-total">            <span>Sisa Bersih</span>            <span :class="netCashflow >= 0 ? 'text-income' : 'text-expense'">{{ fmt(netCashflow) }}</span>        </div>    </section>    <section class="card">        <p class="section-label">Semua Transaksi Bulan Ini</p>        <div v-if="monthTransactions.length === 0" class="empty-state">            <i data-lucide="inbox"></i>            <p>Belum ada transaksi bulan ini.</p>        </div>        <ul class="tx-list" v-else>            <li v-for="t in monthTransactions" :key="t.id" class="tx-item">                <div class="tx-icon" :class="t.jenis === 'income' ? 'tx-income' : 'tx-expense'">                    <i :data-lucide="t.jenis === 'income' ? 'arrow-down-left' : 'arrow-up-right'"></i>                </div>                <div class="tx-info">                    <p class="tx-cat">{{ t.kategori }}</p>                    <p class="tx-note">{{ t.tanggal }} · {{ t.catatan }}</p>                </div>                <div class="tx-right">                    <p class="tx-amount" :class="t.jenis === 'income' ? 'text-income' : 'text-expense'">{{ t.jenis === 'income' ? '+' : '-' }}{{ fmt(t.nominal) }}</p>                    <button class="tx-delete" @click="$emit('delete-transaction', t)" aria-label="Hapus"><i data-lucide="trash-2"></i></button>                </div>            </li>        </ul>    </section>    <!-- ===== LAPORAN CETAK (hanya tampil saat print / PDF) ===== -->    <section class="print-report">        <header class="print-header">            <h1>PundiCerdas</h1>            <p>Laporan Cashflow Bulanan — {{ periodLabel }}</p>        </header>        <table class="print-summary">            <tbody>                <tr><td>Pemasukan</td><td class="pr-num">{{ fmt(totalIncome) }}</td></tr>                <tr><td>Fixed Cost (Kantong Rutin)</td><td class="pr-num">-{{ fmt(totalFixedCost) }}</td></tr>                <tr><td>Pengeluaran Variabel</td><td class="pr-num">-{{ fmt(totalVariable) }}</td></tr>                <tr class="pr-total"><td>Sisa Bersih (Net Cashflow)</td><td class="pr-num">{{ fmt(netCashflow) }}</td></tr>                <tr><td>Proyeksi Sisa Akhir Bulan</td><td class="pr-num">{{ fmt(projectedNet) }}</td></tr>            </tbody>        </table>        <p class="print-table-title">Rincian Transaksi Bulan Ini</p>        <table class="print-table">            <thead>                <tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th class="pr-num">Nominal</th><th>Catatan</th></tr>            </thead>            <tbody>                <tr v-for="t in monthTransactions" :key="'p-' + t.id">                    <td>{{ t.tanggal }}</td>                    <td>{{ t.jenis === 'income' ? 'Income' : 'Expense' }}</td>                    <td>{{ t.kategori }}</td>                    <td class="pr-num">{{ t.jenis === 'income' ? '+' : '-' }}{{ fmt(t.nominal) }}</td>                    <td>{{ t.catatan }}</td>                </tr>            </tbody>        </table>        <p class="print-footer">Dicetak otomatis oleh PundiCerdas.</p>    </section></div></script><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>window.SUPABASE_CONFIG = {    url: 'https://vwvbefxkquvunvrumdxd.supabase.co',    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3dmJlZnhrcXV2dW52cnVtZHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MTI3NTYsImV4cCI6MjEwMTM4ODc1Nn0.MNL3UKsQLsrmB2q6vUaUj4UjTuxJqSTa4t8Cba29Mto'};</script><script>/* ============================================================   PUNDI CERDAS — Vue 3 (CDN) Application Logic   Backend: Supabase (source of truth) + realtime sync antar device.   Fallback: local cache (localStorage) untuk tampilan instan/offline.   ============================================================ */(function () {    const { createApp } = Vue;    /* ---------------- Supabase client ---------------- */    const cfg = window.SUPABASE_CONFIG || null;    const sb = (cfg && window.supabase && cfg.url && cfg.anonKey && !cfg.url.includes('xxxxx'))        ? window.supabase.createClient(cfg.url, cfg.anonKey)        : null;    const LOCAL_CACHE_KEY = 'pk_cache_v3';    const DEFAULT_FIXED = [{ id: 'FC-ISTRI', nama: 'Transfer Istri', nominal: 3000000, status: 'belum' }];    const DEFAULT_CATEGORIES = [        { id: 'CAT-MAKAN', nama: 'Makan', icon: 'utensils', color: 'mint' },        { id: 'CAT-BENSIN', nama: 'Bensin', icon: 'fuel', color: 'orange' },        { id: 'CAT-KOPI', nama: 'Kopi', icon: 'coffee', color: 'amber' },        { id: 'CAT-PARKIR', nama: 'Parkir', icon: 'parking-circle', color: 'indigo' },        { id: 'CAT-BELANJA', nama: 'Belanja', icon: 'shopping-bag', color: 'rose' },        { id: 'CAT-TAGIHAN', nama: 'Tagihan', icon: 'receipt', color: 'cyan' },        { id: 'CAT-HIBURAN', nama: 'Hiburan', icon: 'popcorn', color: 'violet' },        { id: 'CAT-LAINNYA', nama: 'Lainnya', icon: 'package', color: 'slate' }    ];    const CUSTOM_CAT_PALETTE = ['mint', 'orange', 'amber', 'indigo', 'rose', 'cyan', 'violet', 'slate'];    /* ---------------- Utilities ---------------- */    function uid(prefix) {        return (prefix || 'TX') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);    }    function todayISO() {        const d = new Date();        const off = d.getTimezoneOffset();        return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);    }    function formatRupiah(n) {        n = Number(n) || 0;        const sign = n < 0 ? '-' : '';        return sign + 'Rp' + Math.round(Math.abs(n)).toLocaleString('id-ID');    }    function formatInputRupiah(str) {        const digits = String(str).replace(/[^0-9]/g, '');        if (!digits) return '';        return Number(digits).toLocaleString('id-ID');    }    function parseRupiah(str) {        return Number(String(str).replace(/[^0-9]/g, '')) || 0;    }    function daysInMonth(date) {        return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();    }    function isSameMonth(dateStr, ref) {        if (!dateStr) return false;        const d = new Date(dateStr + 'T00:00:00');        return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();    }    const U = { uid, todayISO, formatRupiah, formatInputRupiah, parseRupiah, daysInMonth, isSameMonth };    function renderIcons() {        if (window.lucide && typeof window.lucide.createIcons === 'function') {            window.lucide.createIcons();        }    }    /* ============================================================       COMPONENT: Tab Harian (Pengeluaran Harian)       ============================================================ */    const TabHarian = {        template: '#tab-harian-template',        props: {            categories: { type: Array, default: () => [] },            sisaJatahHarian: { type: Number, default: 0 },            historyToday: { type: Array, default: () => [] },            totalToday: { type: Number, default: 0 }        },        emits: ['add-transaction', 'delete-transaction', 'request-add-category'],        data() {            return {                jenis: 'expense',                kategori: '',                nominalDisplay: '',                catatan: ''            };        },        methods: {            fmt(n) { return U.formatRupiah(n); },            pickCategory(c) {                this.jenis = 'expense';                this.kategori = c.nama;            },            catColor(nama) {                const c = this.categories.find(x => x.nama === nama);                return c ? c.color : 'slate';            },            catIcon(nama) {                const c = this.categories.find(x => x.nama === nama);                return c ? c.icon : 'package';            },            onNominalInput(e) {                this.nominalDisplay = U.formatInputRupiah(e.target.value);            },            submit() {                const nominal = U.parseRupiah(this.nominalDisplay);                if (!this.kategori.trim() || !nominal) return;                this.$emit('add-transaction', {                    tanggal: U.todayISO(),                    jenis: this.jenis,                    kategori: this.kategori.trim(),                    nominal,                    catatan: this.catatan.trim() || '-',                    sheetTarget: 'Harian'                });                this.kategori = '';                this.nominalDisplay = '';                this.catatan = '';                this.jenis = 'expense';            }        },        mounted() { renderIcons(); },        updated() { renderIcons(); }    };    /* ============================================================       COMPONENT: Tab Bulanan (Dashboard, Fixed Cost, Pos Anggaran, Forecast, Report)       ============================================================ */    const TabBulanan = {        template: '#tab-bulanan-template',        props: {            fixedCosts: { type: Array, default: () => [] },            budgetItems: { type: Array, default: () => [] },            totalIncome: { type: Number, default: 0 },            totalFixedCost: { type: Number, default: 0 },            totalVariable: { type: Number, default: 0 },            budgetVariable: { type: Number, default: 0 },            netCashflow: { type: Number, default: 0 },            progressPercent: { type: Number, default: 0 },            progressColorClass: { type: String, default: 'progress-success' },            monthTransactions: { type: Array, default: () => [] },            actualDailyPace: { type: Number, default: 0 },            idealDailyPace: { type: Number, default: 0 },            projectedVariable: { type: Number, default: 0 },            projectedNet: { type: Number, default: 0 },            forecastStatus: { type: String, default: 'surplus' },            periodLabel: { type: String, default: '' }        },        emits: [            'toggle-fixed', 'delete-fixed', 'delete-transaction', 'delete-budget-item',            'request-add-fixed', 'request-add-budget', 'wa-report'        ],        methods: {            fmt(n) { return U.formatRupiah(n); },            toggle(item) { this.$emit('toggle-fixed', item); },            paceWidth(value) {                const max = Math.max(this.actualDailyPace, this.idealDailyPace, 1);                return Math.min(100, Math.round((value / max) * 100));            },            printReport() { window.print(); },            exportCSV() {                const header = ['ID Transaksi', 'Tanggal', 'Jenis', 'Kategori', 'Nominal', 'Catatan'];                const rows = this.monthTransactions.map(t => [                    t.id, t.tanggal, t.jenis === 'income' ? 'Income' : 'Expense', t.kategori, t.nominal, t.catatan                ]);                const escapeCell = v => '"' + String(v).replace(/"/g, '""') + '"';                const csv = [header, ...rows].map(r => r.map(escapeCell).join(',')).join('\r\n');                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });                const url = URL.createObjectURL(blob);                const a = document.createElement('a');                a.href = url;                a.download = 'Laporan_PundiCerdas_' + (this.periodLabel || 'bulan-ini').replace(/\s+/g, '_') + '.csv';                document.body.appendChild(a);                a.click();                document.body.removeChild(a);                URL.revokeObjectURL(url);            }        },        mounted() { renderIcons(); },        updated() { renderIcons(); }    };    /* ============================================================       ROOT APP       ============================================================ */    const App = {        components: { TabHarian, TabBulanan },        data() {            return {                activeTab: 'harian',                settingsOpen: false,                categoryModalOpen: false,                budgetModalOpen: false,                fixedCostModalOpen: false,                connectionStatus: 'connecting', // connecting | online | realtime | offline | error                profileForm: { gajiBulanan: '', budgetVariable: '' },                profile: { gajiBulanan: 0, budgetVariable: 1500000 },                fixedCosts: [],                categories: [],                budgetItems: [],                transactions: [],                newCategory: { nama: '' },                newBudgetItem: { kategori: '', keterangan: '', nominalDisplay: '' },                newFixedCost: { nama: '', nominalDisplay: '' },                toasts: [],                now: new Date(),                _realtimeBound: false            };        },        computed: {            syncIcon() {                switch (this.connectionStatus) {                    case 'connecting': return 'loader-circle';                    case 'realtime': return 'radio';                    case 'online': return 'cloud';                    case 'error': return 'triangle-alert';                    default: return 'cloud-off';                }            },            syncLabel() {                switch (this.connectionStatus) {                    case 'connecting': return 'Menghubungkan';                    case 'realtime': return 'Realtime';                    case 'online': return 'Tersambung';                    case 'error': return 'Gagal konek';                    default: return 'Offline (lokal)';                }            },            thisMonthTx() {                return this.transactions.filter(t => U.isSameMonth(t.tanggal, this.now));            },            thisMonthTxSorted() {                return [...this.thisMonthTx].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));            },            todayTx() {                const today = U.todayISO();                return this.transactions                    .filter(t => t.tanggal === today)                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));            },            totalToday() {                return this.todayTx                    .filter(t => t.jenis === 'expense')                    .reduce((s, t) => s + t.nominal, 0);            },            fixedCostNames() {                return this.fixedCosts.map(f => f.nama);            },            totalIncome() {                return this.thisMonthTx                    .filter(t => t.jenis === 'income')                    .reduce((s, t) => s + t.nominal, 0);            },            totalFixedCost() {                return this.fixedCosts.reduce((s, f) => s + f.nominal, 0);            },            totalVariable() {                return this.thisMonthTx                    .filter(t => t.jenis === 'expense' && !this.fixedCostNames.includes(t.kategori))                    .reduce((s, t) => s + t.nominal, 0);            },            netCashflow() {                return this.totalIncome - this.totalFixedCost - this.totalVariable;            },            progressPercent() {                if (!this.profile.budgetVariable) return 0;                return Math.round((this.totalVariable / this.profile.budgetVariable) * 100);            },            progressColorClass() {                const p = this.progressPercent;                if (p > 90) return 'progress-danger';                if (p >= 70) return 'progress-warning';                return 'progress-success';            },            sisaHariBulan() {                const total = U.daysInMonth(this.now);                return Math.max(1, total - this.now.getDate() + 1);            },            sisaJatahHarian() {                const sisaBudget = Math.max(0, this.profile.budgetVariable - this.totalVariable);                return sisaBudget / this.sisaHariBulan;            },            /* ---------- Forecasting / Proyeksi Akhir Bulan ---------- */            totalDaysInMonth() { return U.daysInMonth(this.now); },            daysElapsed() { return this.now.getDate(); },            actualDailyPace() { return this.daysElapsed > 0 ? this.totalVariable / this.daysElapsed : 0; },            idealDailyPace() { return this.profile.budgetVariable > 0 ? this.profile.budgetVariable / this.totalDaysInMonth : 0; },            projectedVariableFullMonth() { return this.actualDailyPace * this.totalDaysInMonth; },            projectedNet() { return this.totalIncome - this.totalFixedCost - this.projectedVariableFullMonth; },            forecastStatus() { return this.projectedNet >= 0 ? 'surplus' : 'defisit'; },            periodLabel() { return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(this.now); },            /* ---------- Pos Anggaran: target vs realisasi ---------- */            budgetItemsWithRealisasi() {                return this.budgetItems.map(b => {                    const realisasi = this.thisMonthTx                        .filter(t => t.jenis === 'expense' && t.kategori === b.kategori)                        .reduce((s, t) => s + t.nominal, 0);                    const sisa = b.nominalBudget - realisasi;                    let status = 'belum';                    if (realisasi > 0) status = realisasi > b.nominalBudget ? 'boros' : 'aman';                    const statusLabel = status === 'belum' ? 'Belum Bayar' : (status === 'boros' ? 'Boros' : 'Aman');                    const pct = b.nominalBudget > 0 ? (realisasi / b.nominalBudget) * 100 : 0;                    return { ...b, realisasi, sisa, status, statusLabel, pct };                });            }        },        methods: {            fmt(n) { return U.formatRupiah(n); },            /* ---------- Local cache (offline fallback / instant paint) ---------- */            loadCache() {                try {                    const raw = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || 'null');                    if (raw) {                        this.transactions = raw.transactions || [];                        this.fixedCosts = (raw.fixedCosts && raw.fixedCosts.length) ? raw.fixedCosts : DEFAULT_FIXED;                        this.categories = (raw.categories && raw.categories.length) ? raw.categories : DEFAULT_CATEGORIES;                        this.budgetItems = raw.budgetItems || [];                        this.profile = raw.profile || this.profile;                        return;                    }                } catch (e) { /* ignore malformed cache */ }                this.fixedCosts = DEFAULT_FIXED;                this.categories = DEFAULT_CATEGORIES;                this.budgetItems = [];            },            saveCache() {                localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({                    transactions: this.transactions,                    fixedCosts: this.fixedCosts,                    categories: this.categories,                    budgetItems: this.budgetItems,                    profile: this.profile                }));            },            /* ---------- Supabase mapping ---------- */            mapTxFromDb(row) {                return {                    id: row.id,                    createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now(),                    tanggal: row.tanggal,                    jenis: row.jenis,                    kategori: row.kategori,                    nominal: Number(row.nominal) || 0,                    catatan: row.catatan,                    sheetTarget: row.sheet_target,                    fixedCostId: row.fixed_cost_id                };            },            mapBudgetFromDb(row) {                return { id: row.id, kategori: row.kategori, keterangan: row.keterangan, nominalBudget: Number(row.nominal_budget) || 0 };            },            /* ---------- Initial load ---------- */            async loadState() {                this.loadCache(); // tampil instan dari cache dulu                if (!sb) {                    this.connectionStatus = 'offline';                    this.pushToast('config.js belum diisi kredensial Supabase — memakai data lokal', 'warning');                    return;                }                try {                    const [txRes, fixedRes, profRes, catRes, budgetRes] = await Promise.all([                        sb.from('transactions').select('*').order('created_at', { ascending: false }),                        sb.from('fixed_costs').select('*'),                        sb.from('profile').select('*').eq('id', 1).maybeSingle(),                        sb.from('categories').select('*'),                        sb.from('budget_items').select('*')                    ]);                    if (txRes.error) throw txRes.error;                    if (fixedRes.error) throw fixedRes.error;                    if (profRes.error) throw profRes.error;                    if (catRes.error) throw catRes.error;                    if (budgetRes.error) throw budgetRes.error;                    this.transactions = (txRes.data || []).map(this.mapTxFromDb);                    this.fixedCosts = (fixedRes.data && fixedRes.data.length) ? fixedRes.data : DEFAULT_FIXED;                    this.categories = (catRes.data && catRes.data.length) ? catRes.data : DEFAULT_CATEGORIES;                    this.budgetItems = (budgetRes.data || []).map(this.mapBudgetFromDb);                    if (profRes.data) {                        this.profile.gajiBulanan = Number(profRes.data.gaji_bulanan) || 0;                        this.profile.budgetVariable = Number(profRes.data.budget_variable) || 1500000;                    }                    this.saveCache();                    this.connectionStatus = 'online';                    this.subscribeRealtime();                } catch (err) {                    this.connectionStatus = 'error';                    this.pushToast('Gagal konek ke Supabase, pakai data lokal terakhir', 'danger');                }            },            /* ---------- Realtime: dengar perubahan dari device lain ---------- */            subscribeRealtime() {                if (!sb || this._realtimeBound) return;                this._realtimeBound = true;                sb.channel('pundicerdas-changes')                    .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => this.refreshFromServer())                    .on('postgres_changes', { event: '*', schema: 'public', table: 'fixed_costs' }, () => this.refreshFromServer())                    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => this.refreshFromServer())                    .on('postgres_changes', { event: '*', schema: 'public', table: 'budget_items' }, () => this.refreshFromServer())                    .subscribe((status) => {                        if (status === 'SUBSCRIBED') this.connectionStatus = 'realtime';                    });            },            async refreshFromServer() {                if (!sb) return;                try {                    const [txRes, fixedRes, catRes, budgetRes] = await Promise.all([                        sb.from('transactions').select('*').order('created_at', { ascending: false }),                        sb.from('fixed_costs').select('*'),                        sb.from('categories').select('*'),                        sb.from('budget_items').select('*')                    ]);                    if (!txRes.error) this.transactions = (txRes.data || []).map(this.mapTxFromDb);                    if (!fixedRes.error && fixedRes.data && fixedRes.data.length) this.fixedCosts = fixedRes.data;                    if (!catRes.error && catRes.data && catRes.data.length) this.categories = catRes.data;                    if (!budgetRes.error) this.budgetItems = (budgetRes.data || []).map(this.mapBudgetFromDb);                    this.saveCache();                } catch (e) { /* koneksi sempat putus, biarkan state lokal */ }            },            /* ---------- Transactions (optimistic + rollback) ---------- */            async addTransaction(payload) {                const tx = {                    id: U.uid('TX'),                    createdAt: Date.now(),                    tanggal: payload.tanggal,                    jenis: payload.jenis,                    kategori: payload.kategori,                    nominal: payload.nominal,                    catatan: payload.catatan,                    sheetTarget: payload.sheetTarget || 'Harian',                    fixedCostId: payload.fixedCostId || null                };                this.transactions.unshift(tx);                this.saveCache();                this.pushToast(                    (tx.jenis === 'income' ? 'Pemasukan ' : 'Pengeluaran ') + U.formatRupiah(tx.nominal) + ' tercatat 👛',                    'success'                );                if (!sb) return tx;                const { error } = await sb.from('transactions').insert([{                    id: tx.id, tanggal: tx.tanggal, jenis: tx.jenis, kategori: tx.kategori,                    nominal: tx.nominal, catatan: tx.catatan, sheet_target: tx.sheetTarget, fixed_cost_id: tx.fixedCostId                }]);                if (error) {                    this.transactions = this.transactions.filter(t => t.id !== tx.id);                    this.saveCache();                    this.pushToast('Gagal simpan ke Supabase: ' + error.message, 'danger');                    return null;                }                return tx;            },            async deleteTransaction(tx) {                const backup = [...this.transactions];                this.transactions = this.transactions.filter(t => t.id !== tx.id);                this.saveCache();                if (!sb) return;                const { error } = await sb.from('transactions').delete().eq('id', tx.id);                if (error) {                    this.transactions = backup;                    this.saveCache();                    this.pushToast('Gagal hapus di Supabase: ' + error.message, 'danger');                }            },            /* ---------- Fixed cost: toggle, tambah, hapus ---------- */            async toggleFixed(item) {                const prevStatus = item.status;                const nextStatus = prevStatus === 'sudah' ? 'belum' : 'sudah';                item.status = nextStatus;                this.saveCache();                if (sb) {                    const { error } = await sb.from('fixed_costs').update({ status: nextStatus }).eq('id', item.id);                    if (error) {                        item.status = prevStatus;                        this.saveCache();                        this.pushToast('Gagal update status di Supabase: ' + error.message, 'danger');                        return;                    }                }                if (nextStatus === 'sudah') {                    await this.addTransaction({                        tanggal: U.todayISO(), jenis: 'expense', kategori: item.nama,                        nominal: item.nominal, catatan: 'Kantong rutin bulanan', sheetTarget: 'Bulanan', fixedCostId: item.id                    });                    this.pushToast(item.nama + ' ditandai sudah ditransfer', 'success');                } else {                    const match = this.transactions.find(t => t.fixedCostId === item.id && U.isSameMonth(t.tanggal, this.now));                    if (match) await this.deleteTransaction(match);                    this.pushToast(item.nama + ' ditandai belum ditransfer', 'warning');                }            },            onFixedCostNominalInput(e) {                this.newFixedCost.nominalDisplay = U.formatInputRupiah(e.target.value);            },            async addFixedCost() {                const nama = this.newFixedCost.nama.trim();                const nominal = U.parseRupiah(this.newFixedCost.nominalDisplay);                if (!nama || !nominal) { this.pushToast('Isi nama & nominal kantong dulu ya', 'warning'); return; }                const item = { id: U.uid('FC'), nama, nominal, status: 'belum' };                this.fixedCosts.push(item);                this.saveCache();                this.newFixedCost = { nama: '', nominalDisplay: '' };                this.fixedCostModalOpen = false;                this.pushToast('Kantong rutin "' + nama + '" ditambahkan 👛', 'success');                if (!sb) return;                const { error } = await sb.from('fixed_costs').insert([item]);                if (error) {                    this.fixedCosts = this.fixedCosts.filter(f => f.id !== item.id);                    this.saveCache();                    this.pushToast('Gagal simpan ke Supabase: ' + error.message, 'danger');                }            },            async deleteFixedCost(item) {                const backup = [...this.fixedCosts];                this.fixedCosts = this.fixedCosts.filter(f => f.id !== item.id);                this.saveCache();                if (!sb) return;                const { error } = await sb.from('fixed_costs').delete().eq('id', item.id);                if (error) {                    this.fixedCosts = backup;                    this.saveCache();                    this.pushToast('Gagal hapus di Supabase: ' + error.message, 'danger');                }            },            /* ---------- Kategori ---------- */            async addCategory() {                const nama = this.newCategory.nama.trim();                if (!nama) { this.pushToast('Isi nama kategori dulu ya', 'warning'); return; }                if (this.categories.some(c => c.nama.toLowerCase() === nama.toLowerCase())) {                    this.pushToast('Kategori itu sudah ada', 'warning');                    return;                }                const color = CUSTOM_CAT_PALETTE[this.categories.length % CUSTOM_CAT_PALETTE.length];                const item = { id: U.uid('CAT'), nama, icon: 'sparkles', color };                this.categories.push(item);                this.saveCache();                this.newCategory = { nama: '' };                this.categoryModalOpen = false;                this.pushToast('Kategori "' + nama + '" ditambahkan ✨', 'success');                if (!sb) return;                const { error } = await sb.from('categories').insert([item]);                if (error) {                    this.categories = this.categories.filter(c => c.id !== item.id);                    this.saveCache();                    this.pushToast('Gagal simpan ke Supabase: ' + error.message, 'danger');                }            },            /* ---------- Pos Anggaran ---------- */            onBudgetNominalInput(e) {                this.newBudgetItem.nominalDisplay = U.formatInputRupiah(e.target.value);            },            async addBudgetItem() {                const kategori = this.newBudgetItem.kategori;                const keterangan = this.newBudgetItem.keterangan.trim();                const nominalBudget = U.parseRupiah(this.newBudgetItem.nominalDisplay);                if (!kategori || !keterangan || !nominalBudget) {                    this.pushToast('Lengkapi kategori, keterangan & nominal dulu ya', 'warning');                    return;                }                const item = { id: U.uid('BI'), kategori, keterangan, nominalBudget };                this.budgetItems.push(item);                this.saveCache();                this.newBudgetItem = { kategori: '', keterangan: '', nominalDisplay: '' };                this.budgetModalOpen = false;                this.pushToast('Pos anggaran "' + keterangan + '" ditambahkan 🎯', 'success');                if (!sb) return;                const { error } = await sb.from('budget_items').insert([{                    id: item.id, kategori: item.kategori, keterangan: item.keterangan, nominal_budget: item.nominalBudget                }]);                if (error) {                    this.budgetItems = this.budgetItems.filter(b => b.id !== item.id);                    this.saveCache();                    this.pushToast('Gagal simpan ke Supabase: ' + error.message, 'danger');                }            },            async deleteBudgetItem(item) {                const backup = [...this.budgetItems];                this.budgetItems = this.budgetItems.filter(b => b.id !== item.id);                this.saveCache();                if (!sb) return;                const { error } = await sb.from('budget_items').delete().eq('id', item.id);                if (error) {                    this.budgetItems = backup;                    this.saveCache();                    this.pushToast('Gagal hapus di Supabase: ' + error.message, 'danger');                }            },            /* ---------- Rekap WhatsApp ---------- */            getWeekTx() {                const now = this.now;                const day = now.getDay();                const distance = day === 0 ? 6 : day - 1;                const monday = new Date(now);                monday.setDate(now.getDate() - distance);                monday.setHours(0, 0, 0, 0);                return this.transactions.filter(t => new Date(t.tanggal + 'T00:00:00') >= monday);            },            waReport(period) {                const isWeek = period === 'minggu';                const list = isWeek ? this.getWeekTx() : this.thisMonthTx;                const periodText = isWeek ? 'Minggu Ini' : this.periodLabel;                if (list.length === 0) {                    this.pushToast('Belum ada transaksi untuk periode ini', 'warning');                    return;                }                const income = list.filter(t => t.jenis === 'income').reduce((s, t) => s + t.nominal, 0);                const fixedInPeriod = list.filter(t => t.jenis === 'expense' && this.fixedCostNames.includes(t.kategori)).reduce((s, t) => s + t.nominal, 0);                const variableInPeriod = list.filter(t => t.jenis === 'expense' && !this.fixedCostNames.includes(t.kategori)).reduce((s, t) => s + t.nominal, 0);                const net = income - fixedInPeriod - variableInPeriod;                const catTotals = {};                list.filter(t => t.jenis === 'expense' && !this.fixedCostNames.includes(t.kategori)).forEach(t => {                    catTotals[t.kategori] = (catTotals[t.kategori] || 0) + t.nominal;                });                const topCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 3);                const borosItems = this.budgetItemsWithRealisasi.filter(b => b.status === 'boros');                const belumFixed = this.fixedCosts.filter(f => f.status === 'belum');                let text = '👛 *PUNDICERDAS — REKAP CASHFLOW* 👛\n';                text += '🗓️ *Periode:* ' + periodText + '\n';                text += '--------------------------------\n\n';                text += '💰 *Pemasukan:* ' + U.formatRupiah(income) + '\n';                text += '📌 *Fixed Cost:* ' + U.formatRupiah(fixedInPeriod) + '\n';                text += '💸 *Pengeluaran Variabel:* ' + U.formatRupiah(variableInPeriod) + '\n';                text += '📈 *Arus Kas:* ' + (net >= 0 ? 'SURPLUS +' : 'DEFISIT -') + U.formatRupiah(Math.abs(net)) + '\n';                if (!isWeek) {                    text += '🔮 *Proyeksi Akhir Bulan:* ' + U.formatRupiah(this.projectedNet) + '\n';                }                if (topCats.length > 0) {                    text += '\n🏆 *Kategori Terbesar:*\n';                    topCats.forEach(([kat, val], i) => { text += (i + 1) + '. ' + kat + ' — ' + U.formatRupiah(val) + '\n'; });                }                if (belumFixed.length > 0) {                    text += '\n⏳ *Kantong Belum Ditransfer:*\n';                    belumFixed.forEach(f => { text += '• ' + f.nama + ' (' + U.formatRupiah(f.nominal) + ')\n'; });                }                if (borosItems.length > 0) {                    text += '\n🚨 *Pos Anggaran Boros:*\n';                    borosItems.forEach(b => { text += '• ' + b.keterangan + ' (lebih ' + U.formatRupiah(Math.abs(b.sisa)) + ')\n'; });                }                text += '\n--------------------------------\n📱 _PundiCerdas — Cashflow Suami_';                window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');            },            /* ---------- Settings ---------- */            openSettings() {                this.profileForm = {                    gajiBulanan: U.formatInputRupiah(String(this.profile.gajiBulanan || '')),                    budgetVariable: U.formatInputRupiah(String(this.profile.budgetVariable || ''))                };                this.settingsOpen = true;            },            onSettingsNominalInput(field, e) {                this.profileForm[field] = U.formatInputRupiah(e.target.value);            },            async saveSettings() {                this.profile.gajiBulanan = U.parseRupiah(this.profileForm.gajiBulanan);                this.profile.budgetVariable = U.parseRupiah(this.profileForm.budgetVariable);                this.saveCache();                this.settingsOpen = false;                this.pushToast('Pengaturan disimpan', 'success');                if (!sb) return;                const { error } = await sb.from('profile').upsert({                    id: 1, gaji_bulanan: this.profile.gajiBulanan, budget_variable: this.profile.budgetVariable                });                if (error) this.pushToast('Gagal simpan ke Supabase: ' + error.message, 'danger');            },            /* ---------- Toasts ---------- */            pushToast(msg, type) {                const id = Date.now() + Math.random();                this.toasts.push({ id, msg, type: type || 'success' });                setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3000);            }        },        mounted() {            this.loadState();            renderIcons();        },        updated() {            renderIcons();        }    };    createApp(App).mount('#app');})();</script></body></html>
